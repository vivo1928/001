name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: gradle

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # 原生依赖与补丁脚本变化时必须重建 node_modules，
          # 否则会复用旧的原生源码，出现"补丁未生效/重复应用"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'dependencies-patch.js', 'third-party/react-native-track-player/**') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply dependency patches
        run: node dependencies-patch.js

      - name: Set Gradle heap to 8GB
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m/' android/gradle.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            --init-script init.gradle \
            -PMYAPP_UPLOAD_STORE_FILE='keystore.jks' \
            -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' \
            -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}' \
            --no-daemon --stacktrace

      - name: Clean Keystore
        if: always()
        run: rm -f android/app/keystore.jks

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk \
            lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a-release.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}-${{ github.run_number }}
          name: v${{ env.PACKAGE_VERSION }} (build #${{ github.run_number }})
          files: lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a-release.apk
          prerelease: true
          make_latest: false

      # 固定下载地址：每次构建都覆盖同一个 tag/文件名，链接永远指向最新版
      - name: Publish fixed latest download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a-release.apk" lx-music-mobile-latest.apk
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "最新版本（固定下载链接）" \
              --notes "此处的安装包始终是最新构建，下载文件名固定为 lx-music-mobile-latest.apk" \
              --prerelease
          fi
          gh release upload latest lx-music-mobile-latest.apk --repo "$GITHUB_REPOSITORY" --clobber